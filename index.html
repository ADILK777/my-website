<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAVAL1IGHT | GOD AIM</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron', sans-serif;
}

body{
    background:#0a0a0a;
    color:white;
    overflow-x:hidden;
}

/* NAV */

header{
    position:fixed;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 60px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(10px);
    z-index:1000;
}

.logo{
    font-size:26px;
    font-weight:900;
    color:#ff003c;
    letter-spacing:4px;
    text-shadow:0 0 10px #ff003c;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:30px;
    font-size:14px;
    transition:0.3s;
}

nav a:hover{
    color:#ff003c;
}

/* HERO */

.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:radial-gradient(circle at center, #1a0005 0%, #000 70%);
}

.hero h1{
    font-size:100px;
    font-weight:900;
    color:#ff003c;
    text-shadow:
        0 0 10px #ff003c,
        0 0 20px #ff003c,
        0 0 40px #ff003c;
    animation:glitch 1s infinite;
}

.hero h2{
    margin-top:20px;
    font-size:22px;
    letter-spacing:5px;
    color:#888;
}

.btn{
    margin-top:40px;
    padding:18px 50px;
    font-size:16px;
    background:#ff003c;
    border:none;
    color:white;
    cursor:pointer;
    letter-spacing:2px;
    transition:0.3s;
}

.btn:hover{
    background:white;
    color:#ff003c;
    box-shadow:0 0 20px #ff003c;
}

/* GLITCH EFFECT */

@keyframes glitch{
    0%{ transform:translate(0); }
    20%{ transform:translate(-3px,3px); }
    40%{ transform:translate(-3px,-3px); }
    60%{ transform:translate(3px,3px); }
    80%{ transform:translate(3px,-3px); }
    100%{ transform:translate(0); }
}

/* SECTION */

.section{
    padding:120px 60px;
    text-align:center;
}

.section h3{
    font-size:40px;
    color:#ff003c;
    margin-bottom:50px;
}

.stats{
    display:flex;
    justify-content:center;
    gap:60px;
    flex-wrap:wrap;
}

.stat{
    background:#111;
    padding:40px;
    width:250px;
    border:1px solid #ff003c;
    transition:0.3s;
}

.stat:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px #ff003c;
}

.stat h4{
    font-size:45px;
    color:#ff003c;
}

.stat p{
    margin-top:10px;
    font-size:14px;
    color:#aaa;
}

/* FOOTER */

footer{
    padding:30px;
    text-align:center;
    background:#000;
    border-top:1px solid #ff003c;
    color:#666;
}
</style>
</head>

<body>

<header>
    <div class="logo">CAVAL1IGHT</div>
    <nav>
        <a href="#">HOME</a>
        <a href="#">ROSTER</a>
        <a href="#">MATCHES</a>
        <a href="#">CONTACT</a>
    </nav>
</header>

<section class="hero">
    <h1>CAVAL1IGHT</h1>
    <h2>WE DON'T MISS.</h2>
    <button class="btn">ENTER THE WARZONE</button>
</section>

<section class="section">
    <h3>GOD AIM STATS</h3>
    <div class="stats">
        <div class="stat">
            <h4>92%</h4>
            <p>HEADSHOT RATE</p>
        </div>
        <div class="stat">
            <h4>+450</h4>
            <p>RANKED WINS</p>
        </div>
        <div class="stat">
            <h4>#1</h4>
            <p>MENTALITY</p>
        </div>
    </div>
</section>

<footer>
    © 2026 CAVAL1IGHT | Built Different | Dev by A1d
</footer>

</body>
</html>
